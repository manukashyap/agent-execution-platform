spring:
  application:
    name: aep
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AEP_DB_URL:jdbc:postgresql://localhost:5432/aep}
    username: ${AEP_DB_USER:aep}
    password: ${AEP_DB_PASSWORD:aep}
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      enabled: true
      file: compose.yml
      lifecycle-management: start-only
      profiles:
        active: lite
      skip:
        in-tests: true

server:
  port: ${AEP_PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,flyway
  endpoint:
    health:
      probes:
        enabled: true

aep:
  temporal:
    target: ${AEP_TEMPORAL_TARGET:localhost:7233}
    namespace: ${AEP_TEMPORAL_NAMESPACE:default}
    task-queue: ${AEP_TEMPORAL_TASK_QUEUE:aep-main}
    start-worker: true
  outbound:
    connect-timeout: 2s
    allow-hosts: ${AEP_OUTBOUND_ALLOW_HOSTS:localhost:8090,mocks:8090}
    self-hosts: ${AEP_OUTBOUND_SELF_HOSTS:localhost:8000,app:8000}
  tenancy:
    dev:
      dev-api-key: ${AEP_DEV_API_KEY:}
      other-api-key: ${AEP_DEV_OTHER_API_KEY:}
  router:
    # cost is USD per 1,000 tokens (prompt + completion); rps = token-bucket capacity and refill per second
    providers:
      llm-a:
        base-url: ${AEP_LLM_A_URL:http://localhost:8090/llm/llm-a}
        model: model-a
        nominal-latency: 200ms
        cost-per-thousand-tokens-usd: 0.010
        rps: 100
        capabilities: [chat, tools, json]
      llm-b:
        base-url: ${AEP_LLM_B_URL:http://localhost:8090/llm/llm-b}
        model: model-b
        nominal-latency: 500ms
        cost-per-thousand-tokens-usd: 0.004
        rps: 500
        capabilities: [chat, tools, json]
      vllm:
        base-url: ${AEP_VLLM_URL:http://localhost:8090/llm/vllm}
        model: vllm-default
        nominal-latency: 100ms
        cost-per-thousand-tokens-usd: 0.002
        rps: 200
        capabilities: [chat, json]
    spill:
      from: vllm
      high-to: llm-a
      default-to: llm-b
    no-provider-retry-delay: 1s
    # tenant-allow-list:
    #   "[t_other]": [llm-b, vllm]   # tenants not listed may use every provider
