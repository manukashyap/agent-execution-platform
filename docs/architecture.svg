<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="ti de">
<title id="ti">Agent Execution Platform architecture</title>
<desc id="de">Client to API, Temporal and Postgres, worker activities, LLM router, tool gateway, outbound egress and observability.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<style>
text{font-family:Helvetica,Arial,sans-serif}
.box{fill:#fff;stroke:#475569;stroke-width:1.2}
.hi{fill:#e0f2fe;stroke:#0369a1;stroke-width:1.4}
.eg{fill:#fef3c7;stroke:#b45309;stroke-width:1.8}
.ext{fill:#f1f5f9;stroke:#64748b;stroke-width:1.2;stroke-dasharray:none}
.zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}
.z{font-size:11px;fill:#64748b;font-weight:bold}
.t{font-size:12px;font-weight:bold;fill:#0f172a}
.s{font-size:9.5px;fill:#334155}
.l{font-size:9.5px;fill:#475569;font-style:italic}
.a{stroke:#334155;stroke-width:1.3}
.dash{stroke-dasharray:4 3}
</style>
<rect width="1100" height="560" fill="#fff"/>
<text x="20" y="24" font-size="16" font-weight="bold" fill="#0f172a">Agent Execution Platform: request path, durable execution, egress</text>
<rect class="zone" x="150" y="40" width="430" height="170" rx="10"/>
<text class="z" x="160" y="55">API role (Spring Boot)</text>
<rect class="zone" x="150" y="230" width="430" height="300" rx="10"/>
<text class="z" x="160" y="245">Worker role (Spring Boot)</text>
<rect class="zone" x="600" y="40" width="230" height="170" rx="10"/>
<text class="z" x="610" y="55">Temporal</text>
<rect class="zone" x="600" y="230" width="230" height="300" rx="10"/>
<text class="z" x="610" y="245">Providers / tools (mocks service)</text>
<rect class="zone" x="850" y="40" width="230" height="170" rx="10"/>
<text class="z" x="860" y="55">Postgres 16</text>
<rect class="zone" x="850" y="230" width="230" height="300" rx="10"/>
<text class="z" x="860" y="245">Observability</text>
<rect class="ext" x="20" y="100" width="100" height="50" rx="6"/>
<text class="t" x="70.0" y="117" text-anchor="middle">Client</text>
<text class="s" x="70.0" y="132" text-anchor="middle">REST + API key</text>
<rect class="box" x="165" y="62" width="190" height="62" rx="6"/>
<text class="t" x="260.0" y="79" text-anchor="middle">Auth + scope</text>
<text class="s" x="260.0" y="94" text-anchor="middle">ApiKeyAuthFilter, @RequiresScope</text>
<text class="s" x="260.0" y="107" text-anchor="middle">tenant from key hash</text>
<rect class="box" x="370" y="62" width="195" height="62" rx="6"/>
<text class="t" x="467.5" y="79" text-anchor="middle">Admission</text>
<text class="s" x="467.5" y="94" text-anchor="middle">token bucket + soft cap</text>
<text class="s" x="467.5" y="107" text-anchor="middle">Idempotency-Key</text>
<rect class="box" x="165" y="136" width="400" height="60" rx="6"/>
<text class="t" x="365.0" y="153" text-anchor="middle">Controllers + ExecutionLauncher</text>
<text class="s" x="365.0" y="168" text-anchor="middle">POST /v1/workflows/{id}/executions -> 202</text>
<text class="s" x="365.0" y="181" text-anchor="middle">GET /v1/executions/{id}, /trace, /preview</text>
<rect class="hi" x="615" y="62" width="200" height="62" rx="6"/>
<text class="t" x="715.0" y="79" text-anchor="middle">DagInterpreterWorkflow</text>
<text class="s" x="715.0" y="94" text-anchor="middle">queue aep-main, id exec:tenant:id</text>
<text class="s" x="715.0" y="107" text-anchor="middle">fairness key = tenant</text>
<rect class="box" x="615" y="136" width="200" height="60" rx="6"/>
<text class="t" x="715.0" y="153" text-anchor="middle">Temporal server</text>
<text class="s" x="715.0" y="168" text-anchor="middle">history, timers, retries</text>
<text class="s" x="715.0" y="181" text-anchor="middle">priority + fairness policy</text>
<rect class="box" x="865" y="62" width="200" height="62" rx="6"/>
<text class="t" x="965.0" y="79" text-anchor="middle">Definitions + executions</text>
<text class="s" x="965.0" y="94" text-anchor="middle">definition, execution,</text>
<text class="s" x="965.0" y="107" text-anchor="middle">node_run, node_output</text>
<rect class="box" x="865" y="136" width="200" height="60" rx="6"/>
<text class="t" x="965.0" y="153" text-anchor="middle">Cost + audit</text>
<text class="s" x="965.0" y="168" text-anchor="middle">ledger, budgets, llm_call,</text>
<text class="s" x="965.0" y="181" text-anchor="middle">tool_call_audit</text>
<rect class="hi" x="165" y="252" width="190" height="62" rx="6"/>
<text class="t" x="260.0" y="269" text-anchor="middle">NodeActivity</text>
<text class="s" x="260.0" y="284" text-anchor="middle">heartbeat, retry, node_run</text>
<text class="s" x="260.0" y="297" text-anchor="middle">projection, budget reserve</text>
<rect class="hi" x="370" y="252" width="195" height="62" rx="6"/>
<text class="t" x="467.5" y="269" text-anchor="middle">CompensationActivity</text>
<text class="s" x="467.5" y="284" text-anchor="middle">reverse-order saga</text>
<text class="s" x="467.5" y="297" text-anchor="middle">refunds via ledger</text>
<rect class="box" x="165" y="336" width="400" height="50" rx="6"/>
<text class="t" x="365.0" y="353" text-anchor="middle">Executors: http | llm | mcp</text>
<text class="s" x="365.0" y="368" text-anchor="middle">Dry-run registry swaps mocks for side effects</text>
<rect class="hi" x="165" y="398" width="190" height="56" rx="6"/>
<text class="t" x="260.0" y="415" text-anchor="middle">SideEffectGuard</text>
<text class="s" x="260.0" y="430" text-anchor="middle">ledger: effect key, state,</text>
<text class="s" x="260.0" y="443" text-anchor="middle">reconciler (exactly-once)</text>
<rect class="hi" x="370" y="398" width="195" height="56" rx="6"/>
<text class="t" x="467.5" y="415" text-anchor="middle">LlmRouter</text>
<text class="s" x="467.5" y="430" text-anchor="middle">priority scorer, token buckets</text>
<text class="s" x="467.5" y="443" text-anchor="middle">health state machine, spill</text>
<rect class="box" x="165" y="466" width="190" height="50" rx="6"/>
<text class="t" x="260.0" y="483" text-anchor="middle">ToolGateway</text>
<text class="s" x="260.0" y="498" text-anchor="middle">grants, schema check, audit,</text>
<text class="s" x="260.0" y="511" text-anchor="middle">credential provider</text>
<rect class="eg" x="370" y="466" width="195" height="50" rx="6"/>
<text class="t" x="467.5" y="483" text-anchor="middle">OutboundClient</text>
<text class="s" x="467.5" y="498" text-anchor="middle">egress allow-list (only HTTP)</text>
<rect class="ext" x="615" y="252" width="200" height="40" rx="6"/>
<text class="t" x="715.0" y="269" text-anchor="middle">llm-a   |   llm-b</text>
<rect class="ext" x="615" y="300" width="200" height="40" rx="6"/>
<text class="t" x="715.0" y="317" text-anchor="middle">vLLM (self-hosted fallback)</text>
<rect class="ext" x="615" y="348" width="200" height="40" rx="6"/>
<text class="t" x="715.0" y="365" text-anchor="middle">MCP tool servers</text>
<rect class="ext" x="615" y="396" width="200" height="40" rx="6"/>
<text class="t" x="715.0" y="413" text-anchor="middle">CRM / payments / messaging</text>
<rect class="box" x="865" y="252" width="200" height="62" rx="6"/>
<text class="t" x="965.0" y="269" text-anchor="middle">Prometheus metrics</text>
<text class="s" x="965.0" y="284" text-anchor="middle">/actuator/prometheus, queue depth</text>
<text class="s" x="965.0" y="297" text-anchor="middle">node, exec, router, cost series</text>
<rect class="box" x="865" y="326" width="200" height="62" rx="6"/>
<text class="t" x="965.0" y="343" text-anchor="middle">/trace API</text>
<text class="s" x="965.0" y="358" text-anchor="middle">execution timeline from</text>
<text class="s" x="965.0" y="371" text-anchor="middle">node_run, llm_call, audit</text>
<rect class="box" x="865" y="400" width="200" height="50" rx="6"/>
<text class="t" x="965.0" y="417" text-anchor="middle">Structured logs</text>
<text class="s" x="965.0" y="432" text-anchor="middle">tenant + execution id (MDC)</text>
<line class="a" x1="120" y1="125" x2="163" y2="93" marker-end="url(#ah)"/>
<text class="l" x="125" y="108">HTTPS</text>
<line class="a" x1="355" y1="93" x2="368" y2="93" marker-end="url(#ah)"/>
<line class="a" x1="465" y1="124" x2="465" y2="134" marker-end="url(#ah)"/>
<line class="a" x1="565" y1="166" x2="613" y2="93" marker-end="url(#ah)"/>
<text class="l" x="570" y="125">start</text>
<line class="a" x1="715" y1="124" x2="715" y2="134" marker-end="url(#ah)"/>
<line class="a" x1="260" y1="314" x2="260" y2="334" marker-end="url(#ah)"/>
<line class="a" x1="465" y1="314" x2="465" y2="334" marker-end="url(#ah)"/>
<line class="a" x1="260" y1="386" x2="260" y2="396" marker-end="url(#ah)"/>
<line class="a" x1="465" y1="386" x2="465" y2="396" marker-end="url(#ah)"/>
<line class="a" x1="260" y1="454" x2="260" y2="464" marker-end="url(#ah)"/>
<line class="a" x1="355" y1="490" x2="368" y2="490" marker-end="url(#ah)"/>
<line class="a" x1="565" y1="500" x2="613" y2="368" marker-end="url(#ah)"/>
<line class="a" x1="565" y1="495" x2="613" y2="416" marker-end="url(#ah)"/>
<line class="a" x1="465" y1="454" x2="465" y2="464" marker-end="url(#ah)"/>
<line class="a" x1="715" y1="198" x2="715" y2="226"/>
<line class="a" x1="715" y1="226" x2="360" y2="226"/>
<line class="a" x1="360" y1="226" x2="360" y2="250" marker-end="url(#ah)"/>
<text class="l" x="372" y="222" text-anchor="end">schedules activities</text>
<polyline class="a dash" fill="none" points="540,252 540,216 958,216 958,198" marker-end="url(#ah)"/>
<polyline class="a dash" fill="none" points="500,196 500,216"/>
<text class="l" x="725" y="227">state writes: executions, node_run, outputs, ledger, llm_call, audit</text>
<text class="l" x="640" y="470">Every outbound edge passes OutboundClient</text>
<text class="l" x="640" y="484">(egress allow-list, timeout, per-host cap).</text>
<text class="l" x="640" y="506">dashed = state write / read-model</text>
</svg>
